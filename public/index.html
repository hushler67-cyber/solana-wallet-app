<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Wallet Connect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Solana Wallet</h1>

    <button id="connectBtn">Connect Wallet</button>

    <section id="account" class="hidden">
      <p class="row"><span class="label">Address</span><span id="address" class="mono"></span></p>
      <p class="row"><span class="label">SOL Balance</span><span id="solBalance"></span></p>

      <h2>Tokens</h2>
      <ul id="tokenList"></ul>
      <p id="tgStatus" class="status"></p>

      <button id="disconnectBtn" class="secondary">Disconnect</button>
    </section>
  </main>

  <div id="walletModal" class="modal hidden">
    <div class="modal-content">
      <h2>Select a wallet</h2>
      <ul id="walletList"></ul>
      <button id="closeModal" class="secondary">Cancel</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
